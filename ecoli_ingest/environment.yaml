# Conda environment for running Ecoli_inGEST WITHOUT the Apptainer image.
#
#   mamba env create -f ecoli_ingest/environment.yaml
#   conda activate ecoli_ingest
#   pip install -e ./ecoli_ingest
#
# This list is the single source of truth for the workflow's tool dependencies; the container
# definition in build/Singularity.def is rebuilt from the same list. Only tools the Snakefile and
# its scripts actually call are included.
#
# macOS: bioconda builds vg and centrifuge for Linux only; the barricklab channel provides macOS
# builds of the same versions (Apple Silicon, and Intel with macOS 10.15 or later). It has no Linux
# packages of either, so Linux installs still get them from bioconda.
name: ecoli_ingest
channels:
  - https://barricklab.github.io/conda/
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - pyyaml
  - pandas
  - numpy
  - snakemake-minimal>=9,<10
  # reads given by accession: prefetch + fasterq-dump (ENA download is the backup), pigz to compress
  - sra-tools>=3
  - pigz
  # read QC / trimming / contamination
  - fastp
  - fastqc=0.12.1       # the Java FastQC; 0.13 is a different program with another CLI
  - openjdk
  - centrifuge
  # alignment to the pangenome graph and BAM handling
  - vg=1.63.1
  - samtools
  - bedtools
  # quantification and RNA-seq QC
  - subread
  - rseqc
  - multiqc=1.26
  # differential expression
  - r-base
  - bioconductor-deseq2
  - r-ggplot2
  - r-tibble
  - r-dplyr
  - r-readr
  - r-jsonlite
