# Conda environment for running Ecoli_inGEST WITHOUT the Apptainer image.
#
# Exact environment (recommended; the package set the atlas was counted with on Linux):
#   conda create -n ecoli_ingest --file ecoli_ingest/locks/linux-64.txt     # or osx-64 / osx-arm64
#   conda activate ecoli_ingest
#   pip install --no-deps -e ./ecoli_ingest
# From this file (same direct versions, transitive dependencies solved anew):
#   mamba env create -f ecoli_ingest/environment.yaml
#
# This list is the single source of truth for the workflow's tool dependencies. Every direct
# dependency is pinned to the version the atlas recount ran with (its tool_versions.json); the lock
# files in locks/ are made from it by release/make_locks.py, and build/Singularity.def installs the
# linux-64 lock. Only tools the Snakefile and its scripts actually call are included. Change a pin
# here, then regenerate the locks and rebuild the image.
#
# macOS: bioconda builds vg and centrifuge for Linux only; the barricklab channel provides macOS
# builds of the same versions (Apple Silicon and Intel). It has no Linux packages of either, so Linux
# installs still get them from bioconda. The macOS locks assume macOS 12 or later.
name: ecoli_ingest
channels:
  - https://barricklab.github.io/conda/
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.18
  - pip=26.2.2
  - pyyaml=6.0.3
  - pandas=3.1.1
  - numpy=2.4.6
  - snakemake-minimal=9.27.1
  # reads given by accession: prefetch + fasterq-dump (ENA download is the backup), pigz to compress
  - sra-tools=3.4.1
  - pigz=2.8
  # read QC / trimming / contamination
  - fastp=1.4.0
  - fastqc=0.12.1       # the Java FastQC; 0.13 is a different program with another CLI
  - openjdk=25.0.2
  - centrifuge=1.0.4.2
  # alignment to the pangenome graph and BAM handling
  - vg=1.63.1
  - samtools=1.25
  - bedtools=2.31.1
  # quantification and RNA-seq QC
  - subread=2.1.1
  - rseqc=5.0.6
  - multiqc=1.26
  # differential expression
  - r-base=4.5.3
  - bioconductor-deseq2=1.50.2
  - r-ggplot2=4.0.3
  - r-tibble=3.3.1
  - r-dplyr=1.2.1
  - r-readr=2.2.0
  - r-jsonlite=2.0.0
