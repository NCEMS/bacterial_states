# Ecoli_inGEST run configuration. Written by `ecoli_ingest init`; edit and then run
# `ecoli_ingest check` followed by `ecoli_ingest run` in this directory.
#
# Paths are relative to this directory. Outputs go to <experiment>_results/ next to this file.

experiment: "my_experiment"

# Name of the results directory. Uncomment for a fixed name, e.g. when the run directory already
# names the experiment.
# results_dir: "results"

# One entry per sample. Give r2 for paired-end data. If ANY sample lacks r2 the whole run is
# treated as single-end. `condition` is the DESeq2 grouping variable; an optional `condition2`
# is added to the model as a second factor.
#
# Reads can be given as
#   r1 / r2:    one file, or a list of files that are concatenated in order (e.g. several lanes);
#               r2 must list as many files as r1
#   accession:  an SRA/GEO id (SRR/ERR/DRR run, SRX experiment, SRS/SAMN sample or GSM) or a list
#               of them. The reads are fetched into `sra_dir` during the run (see `sra_method`
#               below) and the layout (single/paired) is taken from the archive. Study ids (GSE,
#               SRP, PRJNA) are not accepted: list their GSM/SRR ids as separate samples.
samples:
  wt_1:
    r1: "reads/WT_1.fastq.gz"
    condition: "wildtype"
  wt_2:
    r1: "reads/WT_2.fastq.gz"
    condition: "wildtype"
  ko_1:
    r1: "reads/KO_1.fastq.gz"
    condition: "knockout"
  ko_2:
    r1: "reads/KO_2.fastq.gz"
    condition: "knockout"
# Paired-end example:
#  sample_a:
#    r1: "reads/SRR33308274_1.fastq.gz"
#    r2: "reads/SRR33308274_2.fastq.gz"
#    condition: "wildtype"
# Several files per mate (merged before fastp):
#  sample_b:
#    r1: ["reads/B_L001_R1.fastq.gz", "reads/B_L002_R1.fastq.gz"]
#    r2: ["reads/B_L001_R2.fastq.gz", "reads/B_L002_R2.fastq.gz"]
#    condition: "wildtype"
# Downloaded from SRA (a GEO sample here; several runs are merged into the one sample):
#  sample_c:
#    accession: "GSM1646283"
#    condition: "knockout"

# DESeq2 contrasts as [factor, reference_level, test_level]. The reference is listed first.
deseq2:
  contrasts:
    - ["condition", "wildtype", "knockout"]

# Centrifuge contamination screen (needs the index from `ecoli_ingest download`). Set false to skip
# it: Centrifuge is then not run, its gate is ignored and it is left out of the MultiQC report.
centrifuge: true

# Strand specificity. Only strand-specific libraries are counted: a sample whose reads are not
# at least `strandedness_min_fraction` on one strand is left out of the count table (see
# <results>/strandedness.tsv). "auto" calls each sample from its alignments; "forward" or
# "reverse" states it for every sample of the run. There is no unstranded mode.
strandedness: "auto"
strandedness_min_fraction: 0.8

# Species gate (needs Centrifuge). A sample is not counted when it is not E. coli: another
# organism, a phage infection, or a mixture. It is judged from the genus of the reads Centrifuge
# places uniquely, with Escherichia and Shigella counted together. Samples that are clearly
# something else are stopped before alignment (checkpoints/qc_failures.json, reason "species");
# the full rule is applied after alignment (<results>/strandedness.tsv, column
# not_counted_reason). Set false to only report the values (<sample>/qc/<sample>_species.json).
species_gate: true
# Thresholds, if the defaults (workflow/scripts/species_metrics.py, SPECIES_THRESHOLDS) do not fit:
# species_thresholds:
#   min_pct_escherichia_shigella: 50.0   # share of genus-resolved reads in Escherichia / Shigella
#   min_pct_foreign_of_all: 2.0          # ... and the largest other genus is at least this % of all reads
#   max_pct_foreign_of_all: 10.0         # largest other genus above this % of all reads: mixed sample
#   min_pct_phage_of_all: 0.5            # a phage as the largest other genus at this % of all reads

# Read-filter gate. A sample of which fastp keeps less than this percentage of reads is excluded
# from alignment and counting (see checkpoints/qc_failures.json). Remove the line to disable it.
fastp_min_kept_percentage: 75.0

# Samples given by accession: where downloads and the resolution cache go (default: sra/ in this
# directory; point several run directories at one shared directory to download each run once) and
# how many runs are fetched at the same time (`ecoli_ingest run --max-downloads N` overrides).
# sra_method: auto = sra-tools (prefetch + fasterq-dump, from NCBI) first and the ENA FASTQ files as
# the backup; "sra-tools" or "ena" = that source only.
# The sorted BAM (<sample>/vg/<sample>_sort.bam) is the largest output. Set false to have it
# deleted once counting and the QC record are done; the per-sample QC record and the coverage
# track keep what is needed from it. (The .gam is always deleted once used.)
keep_alignments: true

# Optional table with a `run_accession` column (for example the atlas manifest's runs.tsv). Library
# and instrument fields of each sample's runs are copied from it into <sample>/qc/<sample>.qc.json.
# run_metadata: "/path/to/runs.tsv"

# sra_dir: "sra"
# max_downloads: 4
# sra_method: "auto"

# Reference resources default to the standard files in the resources directory and normally need
# no changes. Uncomment to override individual files.
# ref: "GCF_000005845_2_ASM584v2_genomic#0#NC_000913.3"
# vg_index: "/path/to/resources/vg/ecoli_graph_test"
# annotation_gff: "/path/to/resources/annotation/GCF_000005845.2_ASM584v2_counting_v2.gff"
# annotation_bed: "/path/to/resources/annotation/GCF_000005845.2_ASM584v2_counting_v2.bed"
# centrifuge_index_path: "/path/to/resources/centrifuge/p_compressed+h+v"
