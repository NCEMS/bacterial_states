<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>/*CSS*/</style>
<script>
window.addEventListener("error", function (e) {
  var b = document.getElementById("error");
  if (b) { b.hidden = false; b.textContent = "The viewer hit an error: " + (e.message || e) + (typeof Plotly === "undefined" ? " (plotly.js did not load: this page needs a network connection, or rebuild it with the plotly Python package installed)" : ""); }
});
</script>
<!--PLOTLY-->
</head>
<body>
<header id="bar">
  <div class="brand"><span id="title">__TITLE__</span><span id="subtitle" class="muted"></span></div>
  <div class="controls">
    <label>Example <select id="preset"><option value="">— choose an example —</option></select></label>
    <div class="search">
      <input id="search" type="search" placeholder="GSE, GSM or words in a study title" list="search-list" autocomplete="off">
      <datalist id="search-list"></datalist>
    </div>
    <label>Layout <select id="layout"></select></label>
    <label>Colour <select id="color"></select></label>
    <span class="splits" id="splits"></span>
    <label class="size">Size <input id="size" type="range" min="1" max="8" step="0.5" value="2.5"></label>
    <button id="reset" title="leave study mode, clear the selection">Overview</button>
  </div>
</header>
<div id="error" hidden></div>
<div id="caption" hidden></div>
<main>
  <div id="plot"></div>
  <aside id="panel">
    <nav class="tabs">
      <button data-tab="sample" class="active">Sample</button>
      <button data-tab="study">Study</button>
      <button data-tab="about">About</button>
    </nav>
    <section id="tab-sample" class="tab active"><p class="muted">Hover over a point to see the sample; click it to open it here.</p></section>
    <section id="tab-study" class="tab"><p class="muted">Pick a study with the search box, an example, or the “Show this study” button of a sample.</p></section>
    <section id="tab-about" class="tab"></section>
  </aside>
</main>
<script id="atlas-data" type="application/json">__DATA__</script>
<script>/*JS*/</script>
</body>
</html>
