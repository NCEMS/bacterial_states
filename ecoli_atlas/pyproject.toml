[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoli-atlas"
version = "1.0.0"
description = "Ecoli_ATLAS: conditional autoencoder embeddings of E. coli RNA-seq samples and comparison against the E. coli expression atlas"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "NCEMS, Penn State" }]
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
tune = ["optuna>=4"]
umap = ["umap-learn>=0.5.7"]
figures = ["matplotlib>=3.8", "seaborn>=0.13", "umap-learn>=0.5.7"]
dev = ["pytest>=7"]

[project.scripts]
ecoli_atlas = "ecoli_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/NCEMS/bacterial_states"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
