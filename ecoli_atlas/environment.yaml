# Conda environment for Ecoli_ATLAS.
#
#   mamba env create -f ecoli_atlas/environment.yaml
#   conda activate ecoli_atlas
#   pip install -e "./ecoli_atlas[dev]"
#
# PyTorch here is the CPU build, which is enough for `embed` and for a single training run (minutes
# on 8 threads). For seed sweeps and cross-validation on a GPU node, put a CUDA build into the same
# environment instead:
#   pip install --force-reinstall torch --index-url https://download.pytorch.org/whl/cu126
# (it brings its own CUDA libraries; only the node's NVIDIA driver is used).
name: ecoli_atlas
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - numpy>=2,<3
  - pandas>=2.2
  - scipy>=1.13
  - scikit-learn>=1.5
  - pytorch-cpu>=2.4   # CPU build; see above for a GPU node
  - pyyaml
  - matplotlib>=3.8    # `figures`
  - seaborn>=0.13
  - gseapy>=1.1         # gene-set enrichment (`figures` gsea, `drivers --gsea`)
  - pytest
