# Conda environment for Ecoli_ATLAS.
#
# Exact environment (recommended):
#   conda create -n ecoli_atlas --file ecoli_atlas/locks/linux-64.txt     # or osx-64 / osx-arm64
#   conda activate ecoli_atlas
#   pip install --no-deps -e ./ecoli_atlas
# From this file (same direct versions, transitive dependencies solved anew):
#   mamba env create -f ecoli_atlas/environment.yaml
#
# Every direct dependency is pinned to the version the current model bundle was made with
# (outputs/models/manifest.json records python, numpy and torch); the lock files in locks/ are made
# from this file by release/make_locks.py and build/Singularity.def installs the linux-64 lock.
#
# PyTorch here is the CPU build, which is enough for `embed`, `compare`, `figures`, `view` and for a
# single training run (minutes on 8 threads). For seed sweeps and cross-validation on a GPU node,
# replace it in the same environment by the pinned CUDA build of the same torch (hash-checked; it brings
# its own CUDA libraries, only the node's NVIDIA driver is used):
#   conda remove -n ecoli_atlas --force -y pytorch pytorch-cpu libtorch
#   pip install --no-deps --require-hashes -r ecoli_atlas/requirements-cuda.txt
name: ecoli_atlas
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.16
  - pip=26.2.2
  - numpy=2.5.4
  - pandas=3.1.1
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - pytorch-cpu=2.14.1   # CPU build; see above for a GPU node
  - pyyaml=6.0.3
  - matplotlib-base=3.11.2   # `figures`; -base: no Qt GUI stack (files are written, never shown)
  - seaborn=0.13.2
  - gseapy=1.3.2         # gene-set enrichment (`figures` gsea, `drivers --gsea`); bioconda
  - umap-learn=0.5.12    # UMAP layouts of `view`, `compare --umap`
  - plotly=7.1.0         # `view`: plotly.js inlined into the page
  - optuna=5.0.0         # hyper-parameter search
  - pytest=9.2.0
